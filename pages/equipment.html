<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Equipment | ERMS</title>

    <link rel="stylesheet" href="../css/base/reset.css">
    <link rel="stylesheet" href="../css/base/variables.css" >
    <link rel="stylesheet" href="../css/base/global.css">

    <link rel="stylesheet" href="../css/pages/equipment.css">
    <link rel="stylesheet" href="../css/components/navbar.css">
    <link rel="stylesheet" href="../css/components/buttons.css">
    <link rel="stylesheet" href="../css/components/cards.css">
    <link rel="stylesheet" href="../css/components/footer.css">

</head>
<body>

    <!-- Navigation -->
    <header class="navbar">
        <div class="container navbar-container">
            <a href="../index.html" class="logo">
                ERMS
            </a>

            <nav class="nav-menu">
                <a href="../index.html">Home</a>
                <a href="equipment.html">Equipment</a>
                <a href="register.html">Register</a>
                <a href="login.html" class="button button-primary">Get Started</a>
            </nav>
        </div>
    </header>

    <!-- MAIN -->
    <main>
        <section class="equipment-page">
            <div class="container">

                <!-- Page Heading -->
                <div class="page-heading">
                    <p class="eyebrow">
                        Equipment Catalog
                    </p>

                    <h1>
                        Available Equipment
                    </h1>

                    <p>
                        Browse our available equipment
                        and choose what you need
                        for your rental.
                    </p>
                </div>

                <!-- Search and Filter -->
                <div class="equipment-controls">
                    <input
                        type="search"
                        id="equipmentSearch"
                        class="equipment-search"
                        placeholder="Search equipment..."
                        aria-label="Search equipment"
                    >

                    <select
                        id="categoryFilter"
                        class="equipment-filter"
                        aria-label="Filter by category"
                    >
                        <option value="all">All Categories</option>
                        <option value="computer">Computers</option>
                        <option value="camera">Cameras</option>
                        <option value="projector">Projectors</option>
                        <option value="audio">Audio Equipment</option>
                    </select>
                </div>

                <!-- Equipment Grid -->
                <div id="equipmentGrid" class="equipment-grid">

                    <!-- Cards will be generated by JavaScript -->

                </div>

                <!-- No Results -->
                <p id="noResults" class="no-results" hidden>
                    No equipment matches your search.
                </p>
            </div>
        </section>
    </main>

    <footer>
            <p>
                &copy; 2026 | Equipment Rental Management System. All rights reserved.
            </p>
    </footer>

    <script src="../js/core/main.js"></script>
    <script src="../js/pages/equipment.js"></script>

</body>
</html>
