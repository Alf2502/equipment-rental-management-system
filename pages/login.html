
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | ERMS</title>

    <!-- Base styles -->
    <link rel="stylesheet" href="../css/base/reset.css">
    <link rel="stylesheet" href="../css/base/variables.css">
    <link rel="stylesheet" href="../css/base/global.css">

    <!-- Component styles -->
    <link rel="stylesheet" href="../css/components/navbar.css">
    <link rel="stylesheet" href="../css/components/buttons.css">

    <!-- Page styles -->
    <link rel="stylesheet" href="../css/pages/login.css">
</head>

<body>

    <header class="navbar">
        <div class="container navbar-container">

            <a href="../index.html" class="logo">
                ERMS
            </a>

            <nav class="nav-menu">
                <a href="../index.html">Home</a>
                <a href="equipment.html">Equipment</a>
                <a href="login.html">Login</a>
            </nav>

        </div>
    </header>

    <main class="auth-page">

        <div class="auth-container">

            <!-- LOGIN -->
            <section id="loginSection" class="auth-section">

                <div class="auth-header">
                    <h1>Welcome Back</h1>
                    <p>Log in to your ERMS account.</p>
                </div>

                <form id="loginForm" class="auth-form">

                    <div class="form-group">
                        <label for="loginEmail">Email Address</label>

                        <input
                            type="email"
                            id="loginEmail"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">Password</label>

                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Login
                    </button>

                </form>

                <p id="loginMessage" class="auth-message"></p>

                <p class="auth-switch">
                    Don't have an account?
                    <a href="#" id="showRegister">Register here</a>
                </p>

            </section>

            <!-- REGISTRATION -->
            <section id="registerSection" class="auth-section hidden">

                <div class="auth-header">
                    <h1>Create Account</h1>
                    <p>Register to start renting equipment.</p>
                </div>

                <form id="registerForm" class="auth-form">

                    <div class="form-group">
                        <label for="firstName">First Name</label>

                        <input
                            type="text"
                            id="firstName"
                            name="firstName"
                            placeholder="Enter your first name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="lastName">Last Name</label>

                        <input
                            type="text"
                            id="lastName"
                            name="lastName"
                            placeholder="Enter your last name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="registerEmail">Email Address</label>

                        <input
                            type="email"
                            id="registerEmail"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter your phone number"
                        >
                    </div>

                    <div class="form-group">
                        <label for="registerPassword">Password</label>

                        <input
                            type="password"
                            id="registerPassword"
                            name="password"
                            placeholder="Minimum 8 characters"
                            minlength="8"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Create Account
                    </button>

                </form>

                <p id="registerMessage" class="auth-message"></p>

                <p class="auth-switch">
                    Already have an account?
                    <a href="#" id="showLogin">Login here</a>
                </p>

            </section>

        </div>

    </main>

    <script src="../js/pages/login.js"></script>

</body>
</html>
